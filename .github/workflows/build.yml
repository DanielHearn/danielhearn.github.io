name: Build portfolio and blog

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/blog/package-lock.json

      - name: Install portfolio dependencies
        run: npm ci

      - name: Install blog dependencies
        run: npm ci
        working-directory: src/blog

      - name: Build portfolio and blog
        run: npm run build
