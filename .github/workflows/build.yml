name: Build portfolio and blog

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/blog/package-lock.json

      - name: Install portfolio dependencies
        run: npm ci

      - name: Install blog dependencies
        run: npm ci
        working-directory: src/blog

      - name: Build portfolio and blog
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage site
        run: |
          mkdir -p dist
          cp index.html 404.html CNAME Final_801685.pdf dist/
          for path in css designs favicons img js blog assets; do
            if [ -d "$path" ]; then cp -R "$path" dist/; fi
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
